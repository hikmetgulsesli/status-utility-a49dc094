<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Page - Status Utility</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 text-slate-800 antialiased font-sans">
  <div data-surface-id="SURF_STATUS_PAGE" class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-slate-200/80 p-8 flex flex-col items-center text-center">
    <div class="w-12 h-12 rounded-full bg-emerald-50 border border-emerald-200 flex items-center justify-center text-emerald-600 mb-4">
      <svg class="w-6 h-6 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
    </div>

    <h1 class="text-2xl font-bold tracking-tight text-slate-900 mb-2">System Status</h1>
    <p class="text-sm text-slate-500 mb-8">Real-time status monitor and diagnostics utility</p>

    <div class="w-full bg-slate-50/80 rounded-xl border border-slate-100 p-5 mb-8 text-left space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200/60">
        <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Service Route</span>
        <span class="text-sm font-mono font-medium text-slate-700 bg-white px-2.5 py-1 rounded border border-slate-200">/status</span>
      </div>

      <div class="flex items-center justify-between pb-3 border-b border-slate-200/60">
        <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">System State</span>
        <span class="text-sm font-medium text-slate-700">Normal Operation</span>
      </div>

      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Status Description</span>
        <span class="text-sm font-semibold text-emerald-600">Status refreshed</span>
      </div>

      <!-- Semantic status value observable container -->
      <meta itemprop="status" content="refreshed">
      <span class="sr-only">refreshed</span>
    </div>

    <button type="button" data-action="ACT_REFRESH_STATUS" data-control-slot="CSLOT_REFRESH_STATUS_REFRESH_BUTTON" class="inline-flex items-center justify-center px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 cursor-pointer">
      Refresh Status
    </button>
  </div>
</body>
</html>
